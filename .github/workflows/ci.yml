name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and Android compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The runner image already has the Android SDK. setup-android@v3 fails on it ("Failed to find package 'tools'"),
      # so only accept the licenses and let Gradle fetch any missing platform package.
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      # The iOS targets cannot be built on Linux; the flag skips them here and the macOS job covers them.
      - name: Desktop tests and Android compile
        run: ./gradlew :forminput:jvmTest :forminput:compileAndroidMain -Pkotlin.native.ignoreDisabledTargets=true

  ios:
    name: iOS compile
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile the iOS targets
        run: ./gradlew :forminput:compileKotlinIosArm64 :forminput:compileKotlinIosSimulatorArm64
